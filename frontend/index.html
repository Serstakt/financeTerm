<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Финансовый терминал</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
<nav id="nav-bar">
    <div class="nav-title">📊 Финансовый терминал</div>
    <button class="nav-btn" data-page="home" onclick="navigateTo('home')">Главная</button>
    <button class="nav-btn" data-page="watchlist" onclick="navigateTo('watchlist')">Watchlist</button>
    <button class="nav-btn" data-page="portfolio" onclick="navigateTo('portfolio')">Портфель</button>
</nav>

<div id="main-content">
    <div id="home-page" class="page">
        <h1 class="home-header">Обзор рынка</h1>
        <div class="tv-market-overview">
            <script type="module" src="https://widgets.tradingview-widget.com/w/ru/tv-market-data.js"></script>
            <tv-market-data symbol-sectors='[{"sectionName":"Indices","symbols":["FOREXCOM:SPXUSD","FOREXCOM:NSXUSD","FOREXCOM:DJI","INDEX:NKY","RUS:IRUS","RUS:RTSI","RUS:RGBI","CAPITALCOM:DXY","OANDA:XAUUSD","BLACKBULL:BRENT","NASDAQ:TLT","BITSTAMP:BTCUSD"]}]' view="performance" heatmap theme="dark"></tv-market-data>
        </div>
        <h2 style="font-size: 18px; margin-bottom: 15px; color: #d1d4dc;">Быстрые действия</h2>
        <div class="quick-actions">
            <div class="action-card" onclick="navigateTo('watchlist')">
                <div class="action-icon">📋</div>
                <div class="action-info"><h3>Watchlist</h3><p>Списки наблюдения с ценами</p></div>
            </div>
            <div class="action-card" onclick="navigateTo('portfolio')">
                <div class="action-icon">💼</div>
                <div class="action-info"><h3>Портфель</h3><p>Управление активами</p></div>
            </div>
        </div>
    </div>

    <div id="watchlist-page" class="page">
        <button id="show-watchlist-btn" title="Показать Watchlist">◀ Списки</button>
        <div id="watchlist">
            <div id="watchlist-header">
                <div id="list-controls">
                    <select id="list-selector" title="Выбрать список"></select>
                    <button id="add-list-btn" class="toggle-watchlist-btn" title="Создать новый список">+</button>
                    <button id="rename-list-btn" class="toggle-watchlist-btn" title="Переименовать список">✎</button>
                    <button id="delete-list-btn" class="toggle-watchlist-btn danger" title="Удалить текущий список">×</button>
                </div>
                <div style="display: flex; align-items: center;">
                    <span id="auto-refresh-indicator"><span class="dot"></span><span id="countdown">120с</span></span>
                    <button class="toggle-watchlist-btn" id="hide-watchlist-btn" title="Скрыть панель">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"></polyline><polyline points="18 17 13 12 18 7"></polyline></svg>
                    </button>
                </div>
            </div>
            <div id="add-form">
                <input id="add-input" placeholder="SBER, AAPL, BTCUSDT" title="Введите тикер. Биржа определяется автоматически." />
                <button id="add-btn" type="button" title="Добавить тикер">+</button>
                <button id="add-section-btn" type="button" title="Добавить раздел">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
                </button>
            </div>
            <div class="column-headers">
                <div class="column-header col-ticker" data-sort="ticker">Тикер <span class="sort-icon">↕</span></div>
                <div class="column-header col-price" data-sort="price">Цена <span class="sort-icon">↕</span></div>
                <div class="column-header col-change" data-sort="change">Изм. <span class="sort-icon">↕</span></div>
                <div class="column-header col-change-pct" data-sort="changePct">Изм.% <span class="sort-icon">↕</span></div>
            </div>
            <div id="ticker-list"></div>
            <div id="io-panel">
                <button id="open-tv-btn" onclick="openOnTradingView()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg> Chart
                </button>
                <button id="open-news-btn" onclick="openSmartLabNews()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8"></path><path d="M15 18h-5"></path><path d="M10 6h8v4h-8V6Z"></path></svg> News
                </button>
                <button id="open-alerts-list-btn" onclick="openAlertsListModal()" style="background: #2a2e39; color: #d1d4dc; border: 1px solid #363a45;">🔔 Алерты</button>
                <div class="admin-dropdown">
                    <button class="admin-trigger">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Настройки
                    </button>
                    <div class="admin-menu">
                        <button id="refresh-btn" onclick="refreshAllPrices()">🔄 Обновить</button>
                        <button onclick="exportAllData()">📤 Экспорт</button>
                        <button onclick="importAllData()">📥 Импорт</button>
                        <button onclick="toggleDebug()">🐞 Debug</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="resizer" title="Потяните, чтобы изменить размер"></div>
        <div id="chart-container"><div id="tradingview_chart"></div></div>
    </div>

    <div id="portfolio-page" class="page">
        <div class="coming-soon">
            <h2>💼 Портфель</h2>
            <p>Здесь будет управление вашими активами, доходностью и аналитика</p>
        </div>
    </div>
</div>

<div id="debug-panel">
    <div class="debug-resize-handle" id="debug-resize-handle" title="Потяните, чтобы изменить размер"></div>
    <button class="debug-close-btn" onclick="closeDebug()" title="Закрыть">×</button>
</div>

<div class="modal-overlay" id="alert-modal">
    <div class="modal-box">
        <div class="modal-title">🔔 Ценовое уведомление: <span id="alert-symbol-name"></span></div>
        <select class="modal-select" id="alert-condition">
            <option value="above">Цена станет ВЫШЕ или равна</option>
            <option value="below">Цена станет НИЖЕ или равна</option>
        </select>
        <input type="number" step="0.01" class="modal-input" id="alert-target-price" placeholder="Целевая цена" />
        <div class="modal-buttons">
            <button class="modal-btn modal-btn-cancel" onclick="closeAlertModal()">Отмена</button>
            <button class="modal-btn modal-btn-save" onclick="saveAlert()">Сохранить</button>
        </div>
        <button class="modal-btn modal-btn-delete" id="alert-delete-btn" onclick="deleteAlert()" style="display: none;">Удалить</button>
    </div>
</div>

<div class="modal-overlay" id="alerts-list-modal">
    <div class="modal-box alerts-list-container">
        <div class="modal-title">📋 Алерты для <span id="alerts-list-symbol" style="color: #2962ff;"></span></div>
        <div id="alerts-list-content" style="margin-bottom: 16px;"></div>
        <div class="modal-buttons">
            <button class="modal-btn modal-btn-cancel" onclick="closeAlertsListModal()">Закрыть</button>
        </div>
    </div>
</div>

<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
